<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211741">
  <title>创建账号 · IELTS Speaking Studio</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./platform-enhancements.css">
</head>
<body class="register-body">
  <div class="connection-banner hidden" id="connectionBanner"></div>
  <main class="register-page" id="registrationPage">
    <a class="register-back" href="./index.html">← 返回登录</a>
    <section class="register-copy"><div class="logo-mark">IS</div><p class="eyebrow">CREATE YOUR SPACE</p><h1>从一次开口，<br>开始更好的表达。</h1><p>选择你的身份，创建专属学习或教学工作台。教师注册需要邀请码；管理员只在平台首次初始化时开放。</p><div class="register-orbit"><span>题库</span><span>练习</span><span>反馈</span><span>成长</span></div></section>
    <section class="register-card"><div class="register-heading"><p class="eyebrow">NEW ACCOUNT</p><h2>创建你的账号</h2><p>账号只用于平台登录，无需填写邮箱。</p></div><form id="signUpForm" class="register-form"><input id="signUpRole" type="hidden" value="student"><div class="role-picker" aria-label="选择身份"><button class="role-choice active" data-registration-role="student" type="button"><b>学生</b><small>练习与提交作业</small></button><button class="role-choice" data-registration-role="teacher" type="button"><b>教师</b><small>建题、布置与反馈</small></button><button class="role-choice admin-choice" data-registration-role="admin" type="button"><b>管理员</b><small>仅首次初始化</small></button></div><label>用户名称<input id="signUpName" maxlength="40" placeholder="例如：陈老师" required></label><div class="split-fields"><label>登录账号<input id="signUpAccount" maxlength="24" autocomplete="username" placeholder="3–24 位字母、数字或 _" required></label><label>设置密码<input id="signUpPassword" type="password" minlength="6" autocomplete="new-password" placeholder="至少 6 位" required></label></div><label class="registration-code-field hidden" id="teacherInviteField">教师邀请码<input id="signUpTeacherInvite" autocomplete="off" placeholder="向管理员获取邀请码"></label><label class="registration-code-field hidden" id="adminSetupField">管理员初始化码<input id="signUpAdminSetupCode" autocomplete="off" placeholder="仅首次初始化使用"></label><button class="button primary wide register-submit" type="submit">创建账号并进入 <span>→</span></button></form><p class="auth-message" id="authMessage" aria-live="polite"></p><p class="register-note" id="registrationNote">学生账号创建后即可使用题库练习和老师布置的任务。</p></section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
